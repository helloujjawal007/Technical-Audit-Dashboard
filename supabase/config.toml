[functions.seo-audit]
verify_jwt = false

[functions.password-reset]
verify_jwt = false

[functions.get-ip]
verify_jwt = false

[auth]
additional_redirect_urls = [
  "https://technical-audit-dashboard.vercel.app",
  "https://technical-audit-dashboard.vercel.app/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/**",
  "https://technical-audit-dashboard-helloujjawal007-8553.vercel.app/",
  "https://technical-audit-dashboard-helloujjawal007-8553.vercel.app/**"
]
site_url = "https://technical-audit-dashboard.vercel.app"

[auth.email]
enable_confirmations = true
max_frequency = "5s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
